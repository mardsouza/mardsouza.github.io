site_name: Marcio de Souza
site_description: Marcio de Souza personal page
site_author: Marcio de Souza
site_url: https://mardsouza.github.io

repo_name: mardsouza.github.io
# repo_url: https://github.com/mardsouza/mardsouza.github.io
edit_uri: 'blob/master/docs'

nav:
  - "Home": 
      - en/index.md

  - "Research": 
      - en/research/index.md

  - "CV": 
      - en/cv/index.md
    
  - "Outreach":
    - en/outreach/index.md
  
  - "Teaching & Talks":
    - en/teaching/index.md

  #- "Blog":
  #  - blog/index.md
 
theme:
  name: material
  # language: en
  palette:
    #- media: "(prefers-color-scheme)"
    #  toggle:
    #    icon: material/link
    #    name: Switch to light mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      # toggle:
      #   icon: material/brightness-4
      #   name: Switch to system preference
  logo: 'assets/empty.svg'
    #primary: red # deep orange
    #accent: amber
  custom_dir: 'docs/overrides'
  favicon: assets/triforce.png
  features:
    - header.autohide
    - navigation.instant
    #- navigation.footer
    #- navigation.tracking
    - navigation.tabs
    #- navigation.tabs.sticky
    #- navigation.sections
    #- navigation.expand
    - navigation.top
    #- search.share
    #- search.suggest
    - toc.integrate
    - toc.follow
    - content.tooltips
    # - content.action.edit
    # - content.action.view
    - content.code.annotate
    # - content.code.copy
  #icon:
  #  annotation: material/information-outline


markdown_extensions:
  - abbr
  - attr_list
  - pymdownx.arithmatex:
  - admonition:
  - md_in_html:
  - pymdownx.details:
  - tables:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
#  - toc:
#      permalink: "link"
#      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite:
  - pymdownx.snippets:
      auto_append:
        - en/includes/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
      - name: mermaid
        class: mermaid
        format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - footnotes
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.blocks.caption

# plugins: []
  #- search
plugins:
  # - blog
  - social
  - i18n:
      docs_structure: folder
      default_language: en
      languages:
        - locale: en
          default: true
          name: English
          build: true
          site_name: Marcio de Souza
          site_description: Physicist, PhD
        - locale: pt-BR
          name: Português-BR
          build: true
          site_name: Marcio de Souza
          site_description: Físico | Doutor em Física
          nav_translations:
            "Home": "Início" 
            "Research": "Pesquisa" 
            "CV" : "Currículo"
            "Outreach" : "Divulgação Científica"
            "Teaching & Talks" : "Ensino e Palestras"




